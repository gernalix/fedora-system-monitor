schema_version: c2.project-capsule.v1
identity:
  project_id: 15
  slug: fedora-system-monitor
  repository_id: R0015
scope:
  purpose: Monitor a Fedora host through bounded collectors, local SQLite history,
    event hooks, and alert integrations.
  boundaries:
  - MegaVault owns canonical cross-project identity and service inventory.
  - Project Git/GitHub owns source work; C3 and historical C2 state are frozen references,
    never active dispatch dependencies.
  - Shared Telegram transport and Uptime Kuma endpoints are external services.
  - Optional execution capture and resource-rescue actions require explicit user consent;
    source verification neither captures host processes nor closes apps or tabs.
repository:
  canonical_workdir: /home/daniele/projects/fedora-system-monitor
  branch_policy: Canonical repository follows origin/main; make changes in isolated
    repo-task worktrees and integrate through the guarded single-writer lane.
architecture:
  summary: Bounded collector/coordinator capsules feed SQLite monitoring, alerting
    and read-only reporting. Database facade delegates alerts, retention and process
    history to separate modules. Optional execution_archive owns private manifests,
    compressed originals and rebuildable FTS; resource_rescue separates pressure policy,
    conservative target identity, dialog and explicitly confirmed app/Chrome actions.
  entrypoints:
  - src/fedora_system_monitor/app.py
  - scripts/install.sh
  important_paths:
  - src/fedora_system_monitor/capsules
  - config
  - systemd
  - hooks
  - udev
  - tests
  - docs/ai
  - docs/human
  - src/fedora_system_monitor/capsules/database
  - src/fedora_system_monitor/capsules/execution_archive
  - src/fedora_system_monitor/capsules/resource_rescue
  - src/fedora_system_monitor/capsules/capacity_policy.py
  - chrome/resource-rescue
  - packaging
dependencies:
- name: Python standard library
  purpose: Runtime, SQLite persistence, CLI, and tests.
- name: systemd and native Fedora event interfaces
  purpose: Schedule collectors and deliver host events.
- name: telegram_notify
  purpose: Shared Telegram message transport; this repository does not implement Telegram
    HTTP calls.
- name: Uptime Kuma Push Monitor
  purpose: Receive category health transitions and bounded heartbeats.
data:
  schema: Local SQLite schema v2 with WAL, UTC and Europe/Copenhagen timestamps, bounded
    event and metric retention, and transactional writes; canonical file is /var/lib/fedora-system-monitor/monitor.sqlite3.
    Process-history samples use the existing monitoring schema. Optional execution-archive
    content lives separately in private user manifests/Zstandard originals and a rebuildable
    SQLite WAL/FTS index; no chat, transcript, browser or backup imports, raw argv/env,
    credential or device-serial persistence. Authorized arbitrary output retains an
    explicit residual secret risk.
  migrations: Schema migration and initialization are implemented in src/fedora_system_monitor/capsules/database;
    do not edit or replace the live database during source validation.
runtime:
  services:
  - fedora-system-monitor-lifecycle.service (source definition; installed state not
    asserted)
  - fedora-system-monitor-collect@.service (source definition; installed state not
    asserted)
  - fedora-system-monitor-prometheus.service (source definition; installed state not
    asserted)
  - fedora-system-monitor-events.service (source definition; installed state not asserted)
  - fedora-system-monitor-oracle-credentials.service precedes the Oracle probe consumer;
    selected files stay under /run.
  - Optional user resource dialog and historical Kuma projection units are source
    inventory only; no new activation or lifecycle dispatch is part of verification.
  timers:
  - fedora-system-monitor-fast.timer (source definition; installed state not asserted)
  - fedora-system-monitor-hourly.timer (source definition; installed state not asserted)
  - fedora-system-monitor-daily.timer (source definition; installed state not asserted)
  - fedora-system-monitor-weekly.timer (source definition; installed state not asserted)
  - fedora-system-monitor-context-index.timer (source definition; installed state
    not asserted)
  containers: []
devices:
- Fedora host sensors and storage are inspected by bounded collectors; never identify
  durable disks by /dev/sdX.
commands:
  setup:
    not_applicable: Runtime dependencies and systemd integration are provisioned by
      the separately gated host installer.
  build:
    not_applicable: Python source is packaged directly; there is no compiled build
      artifact.
  test_targeted:
    argv:
    - python3
    - -B
    - -m
    - unittest
    - discover
    - -s
    - tests
    - -p
    - test_architecture.py
    - -q
    cwd: .
  test_full:
    argv: &id001
    - bwrap
    - --die-with-parent
    - --unshare-net
    - --unshare-pid
    - --ro-bind
    - /
    - /
    - --tmpfs
    - /home
    - --tmpfs
    - /run
    - --tmpfs
    - /tmp
    - --tmpfs
    - /mnt
    - --tmpfs
    - /media
    - --tmpfs
    - /var/lib
    - --proc
    - /proc
    - --dev
    - /dev
    - --ro-bind
    - .
    - /tmp/work
    - --ro-bind
    - /home/daniele/.local/lib/python3.14/site-packages
    - /home/daniele/.local/lib/python3.14/site-packages
    - --chdir
    - /tmp/work
    - --clearenv
    - --setenv
    - PATH
    - /usr/bin:/bin
    - --setenv
    - HOME
    - /tmp
    - --setenv
    - PYTHONPATH
    - /tmp/work:/tmp/work/src:/home/daniele/.local/lib/python3.14/site-packages
    - --setenv
    - PYTHONDONTWRITEBYTECODE
    - '1'
    - --setenv
    - PYTEST_DISABLE_PLUGIN_AUTOLOAD
    - '1'
    - /bin/bash
    - -c
    - set -euo pipefail; PYTHONWARNINGS=error python3 -B -m unittest discover -s tests
      -q; node tests/test_chrome_rescue.mjs; bash -n scripts/*.sh; PYTHONPYCACHEPREFIX=/tmp/pycache
      python3 -m compileall -q src
    cwd: .
  lint:
    argv:
    - git
    - diff
    - --check
    cwd: .
  deploy_install:
    argv:
    - sudo
    - ./scripts/install.sh
    cwd: .
  smoke:
    not_applicable: Live system smoke tests can query hardware, services, databases,
      and notification endpoints; run only as a separately authorized host operation.
  verify:
    fast:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FAST
      cwd: .
    full:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FULL
      cwd: .
safety:
  invariants:
  - Never commit credentials, endpoint values, live databases, backups, or logs.
  - Notification tests use mocks; the shared Telegram transport remains the only Telegram
    implementation.
  - Minute collection must not run SMART scans or wake standby rotational drives.
  - Monitoring never records traffic contents, browser data or arbitrary process arguments.
    Optional execution capture is explicitly consented and filtered; unclassified
    output retains a documented residual secret risk.
  - Resource rescue never force-kills or automatically closes apps or tabs; identity
    and confirmation expire and must be revalidated. Chrome metrics remain partial
    without inventing per-tab resource attribution.
  - Retrieve only required fields through the appropriate Bitwarden runtime; ordered
    file preparation must finish before LoadCredential. Collection snapshots refresh
    on the next cycle, and running processes retain startup credentials.
  risky_operations:
  - scripts/install.sh changes installed runtime and systemd units; use only for an
    explicitly authorized deployment.
  - scripts/uninstall.sh --purge-data deletes configuration and monitoring data and
    requires explicit destructive intent.
  - Live collectors can inspect hardware and send notifications; do not use them for
    source validation.
  recovery:
  - The installer creates an online SQLite backup and retains install backups before
    runtime replacement.
  - Uninstall without --purge-data preserves configuration and monitoring data.
acceptance:
- Capsule FAST and FULL validators pass against the reviewed integrated repository
  head.
- Targeted architecture tests pass without accessing installed services or the live
  database.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only reference; no dispatch or lifecycle writes.
freshness:
  reviewed_commit: bf18c60e3c04f774bbd38e188145843a6166a46b
  watch_paths:
  - src
  - tests
  - systemd
  - udev
  - hooks
  - config
