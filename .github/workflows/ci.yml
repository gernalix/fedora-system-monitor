name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fedora-system-monitor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
          PYTHONWARNINGS: error
        run: python3 -m unittest discover -s tests -q
      - name: Validate deployment shell scripts
        run: |
          bash -n scripts/*.sh
          for script in scripts/*.sh; do
            test -x "$script" || {
              echo "Deployment helper must be executable: $script" >&2
              exit 1
            }
          done
      - name: Compile package
        run: python3 -m compileall -q src
      - name: Verify clean diff
        run: git diff --check
