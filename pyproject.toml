[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fedora-system-monitor"
version = "1.3.1"
description = "Low-overhead Fedora host monitoring with systemd, Python, and SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniele" }]
dependencies = []

[project.scripts]
fedora-system-monitor = "fedora_system_monitor.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
