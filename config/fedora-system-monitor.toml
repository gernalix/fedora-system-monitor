config_version = 1

[monitor]
hostname = ""
timezone = "Europe/Copenhagen"
operator_user = "daniele"
database_path = "/var/lib/fedora-system-monitor/monitor.sqlite3"
backup_directory = "/var/lib/fedora-system-monitor/backups"
lock_path = "/run/fedora-system-monitor/collector.lock"
command_timeout_seconds = 12
log_level = "INFO"

[collection]
critical_filesystems = ["/", "/home", "/var", "/tmp", "/boot", "/boot/efi"]
ignore_filesystem_types = ["autofs", "bpf", "cgroup", "cgroup2", "configfs", "debugfs", "devpts", "devtmpfs", "efivarfs", "erofs", "fusectl", "hugetlbfs", "mqueue", "nsfs", "overlay", "proc", "pstore", "ramfs", "securityfs", "squashfs", "sysfs", "tmpfs", "tracefs"]
top_process_limit = 5
internet_check_enabled = true
internet_host = "1.1.1.1"
internet_port = 443
internet_timeout_seconds = 2.0
gateway_ping_timeout_seconds = 2
journal_lookback_minutes = 20

[services]
auto_detect = true
essential = ["NetworkManager.service", "firewalld.service", "user:discord-exporter-crawl.service"]
secondary = ["bluetooth.service", "libvirtd.service", "podman.service", "docker.service", "rustdesk.service", "smartd.service", "sshd.service", "uptime-kuma.service", "fedora-diagnostics-telemetry.service", "x-repost-downloader.service", "amici-fb.service", "fedora-system-monitor-events.service", "fedora-system-monitor-prometheus.service", "user:activitywatch.service", "user:activitywatch-wayland-watcher.service", "user:espanso.service", "user:tailscale-systray.service", "user:adb-device-keeper.service", "user:telegram-insert-bot.service", "user:workflowy-bridge.service", "user:workflowy-roadmap-sync.service", "user:chrome-codex-switcher.service", "user:github-autosync.service", "user:repo-integrator.service", "user:activity-watch-uploader.service", "user:codex-usage-monitor.service", "user:codex-session-archive.service", "user:codex-usage-publisher.service", "user:prompt-history-sync.service", "user:personalhub-consolidation.service", "user:livinggaul-x-source-availability.service", "user:logseq-updater.service", "user:duplicate-photos-detector-watch.service", "user:sqlite-to-obsidian.service"]
name_patterns = ["backup", "adb", "kuma", "megavault", "monitor"]

# Scheduled oneshot services need semantic freshness, not merely a successful
# inactive state. Values are deliberately wider than their nominal timer cadence
# so one slow run does not flap. The live reconciliation task must verify actual
# installed unit names/cadences before provisioning dedicated Kuma monitors.
[services.freshness_seconds]
"user:sqlite-to-obsidian.service" = 600
"user:github-autosync.service" = 300
"user:repo-integrator.service" = 300
"user:workflowy-roadmap-sync.service" = 300
"user:personalhub-consolidation.service" = 300
"user:activity-watch-uploader.service" = 3600
"user:codex-usage-monitor.service" = 2400
"user:codex-session-archive.service" = 2400
"user:codex-usage-publisher.service" = 2400
"user:prompt-history-sync.service" = 2400
"user:livinggaul-x-source-availability.service" = 10800
"user:logseq-updater.service" = 10800
"amici-fb.service" = 129600

[storage]
known_labels = ["Ventoy", "VTOYEFI", "VEEAMRE", "Seagate Expansion Drive"]
known_model_patterns = ["Samsung Portable SSD T7", "Seagate"]
small_filesystem_max_gib = 5.0
small_filesystem_min_free_mib = 128
expected_devices = []

[inventory]
user_home = "/home/daniele"
android_sdk = "/home/daniele/Android/Sdk"
manual_paths = ["/opt", "/usr/local", "/home/daniele/.local/opt", "/home/daniele/.local/bin"]
launcher_paths = ["/usr/share/applications", "/usr/local/share/applications", "/home/daniele/.local/share/applications"]
appimage_paths = ["/home/daniele/Applications", "/home/daniele/.local/opt", "/home/daniele/Downloads"]
directory_size_paths = ["/var", "/home/daniele/MegaVault", "/home/daniele/Downloads"]
max_scan_depth = 4
metadata_hash_max_bytes = 16777216

[context]
activitywatch_data_path = "/home/daniele/projects/activity-watch-data"
output_directory = "/home/daniele/projects/fedora-context-data"
sync_lookback_minutes = 30
overlap_minutes = 10
max_backfill_hours = 48
incident_before_minutes = 10
incident_after_minutes = 5
git_push = false
git_remote = "origin"
git_branch = "main"
expected_repository = "gernalix/fedora-context-data"
git_timeout_seconds = 120

[thresholds.disk]
warning_free_percent = 20.0
critical_free_percent = 10.0
emergency_free_percent = 5.0
absolute_free_gib = 10.0
recovery_hysteresis_percent = 2.0

[thresholds.inode]
warning_free_percent = 15.0
critical_free_percent = 5.0
recovery_hysteresis_percent = 2.0

[thresholds.temperature]
cpu_warning_c = 90.0
cpu_warning_duration_seconds = 300
cpu_critical_c = 95.0
nvme_warning_c = 70.0
nvme_warning_duration_seconds = 300
nvme_critical_c = 80.0
recovery_hysteresis_c = 5.0

[thresholds.memory]
ram_warning_percent = 90.0
ram_warning_duration_seconds = 300
ram_critical_percent = 95.0
available_warning_percent = 10.0
available_critical_percent = 5.0
psi_some_warning_percent = 10.0
psi_full_critical_percent = 5.0
swap_out_warning_mib_per_second = 16.0
reclaim_warning_pages_per_second = 4096.0
recovery_hysteresis_percent = 5.0

[thresholds.battery]
health_warning_percent = 70.0
health_critical_percent = 50.0
recovery_hysteresis_percent = 5.0

[thresholds.network]
wifi_down_duration_seconds = 120
internet_down_duration_seconds = 180
disconnect_count = 3
disconnect_window_minutes = 30
recovery_samples = 2

[thresholds.services]
restart_loop_count = 3
restart_loop_window_minutes = 15

[retention]
minute_days = 14
five_minute_days = 60
fifteen_minute_days = 180
hourly_days = 365
daily_days = 1825
hardware_event_days = 365
general_event_days = 365
alert_days = 730
inventory_daily_days = 35
backup_daily_count = 14
backup_weekly_count = 8
backup_monthly_count = 12

[notifications]
uptime_kuma_credentials = "/home/daniele/.config/codex/secrets/fedora_system_monitor_uptime_kuma.toml"
telegram_credentials = "/home/daniele/.config/codex/secrets/telegram.env"
filesystem_free_change_gib = 1.0
reminder_seconds = 21600
timeout_seconds = 5
inverted_categories = ["storage"]
